<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warga Kavling Mekarsari RT 005/003</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#243146; --accent:#22c55e; --accent2:#3b82f6;
    --text:#e2e8f0; --muted:#94a3b8; --danger:#ef4444; --warn:#f59e0b; --border:#334155;
    --node-bg:#4472ca; --node-border:#2a5298;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);padding-bottom:70px;}
  .hidden{display:none !important;}
  header.topbar{position:sticky;top:0;background:var(--bg);padding:16px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;z-index:10;}
  header.topbar h1{font-size:16px;margin:0;font-weight:600;}
  header.topbar .sub{font-size:12px;color:var(--muted);}
  .btn{background:var(--accent2);color:#fff;border:none;padding:10px 16px;border-radius:10px;
    font-size:14px;font-weight:600;cursor:pointer;}
  .btn.green{background:var(--accent);}
  .btn.red{background:var(--danger);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn:disabled{opacity:.5;}
  .container{padding:16px;max-width:640px;margin:0 auto;}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--border);}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:10px;font-size:14px;margin-top:6px;margin-bottom:12px;}
  label{font-size:13px;color:var(--muted);}
  .tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .tag.lunas{background:rgba(34,197,94,.15);color:var(--accent);}
  .tag.menunggu{background:rgba(245,158,11,.15);color:var(--warn);}
  .tag.belum{background:rgba(148,163,184,.15);color:var(--muted);}
  .tag.admin{background:rgba(59,130,246,.15);color:var(--accent2);}
  nav.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;z-index:20;}
  nav.bottomnav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 0 8px;
    font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  nav.bottomnav button.active{color:var(--accent2);}
  nav.bottomnav .ic{font-size:20px;}
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .login-box{width:100%;max-width:360px;text-align:center;}
  .login-box h1{font-size:20px;margin-bottom:4px;}
  .login-box p{color:var(--muted);font-size:13px;margin-bottom:24px;}
  .err{color:var(--danger);font-size:13px;margin-top:-6px;margin-bottom:10px;min-height:16px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;}
  .modal{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px;
    max-height:85vh;overflow-y:auto;}
  .modal h3{margin-top:0;}
  .empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px;}
  .fab{position:fixed;bottom:82px;right:16px;background:var(--accent2);color:#fff;border:none;
    width:52px;height:52px;border-radius:50%;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:15;cursor:pointer;}
  .small{font-size:12px;color:var(--muted);}
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .month-nav .m{font-weight:600;font-size:15px;}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
  .summary-grid .card{padding:12px;text-align:center;margin:0;}
  .summary-grid .num{font-size:15px;font-weight:700;}
  .summary-grid .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  img.bukti-preview{width:100%;border-radius:10px;margin-top:8px;max-height:220px;object-fit:cover;}
  .divider{border-top:1px solid var(--border);margin:14px 0;}

  /* ================= STYLES BAGAN ORGANISASI ================= */
  .org-container { overflow-x: auto; padding: 20px 0; text-align: center; }
  .org-chart { display: inline-flex; flex-direction: column; align-items: center; min-width: 680px; padding: 10px; }
  
  .org-node {
    background: var(--node-bg); color: #fff; border: 2px solid var(--node-border);
    border-radius: 12px; padding: 10px 12px; width: 145px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; position: relative; z-index: 2;
  }
  .org-node .title { font-size: 11px; text-decoration: underline; opacity: 0.9; margin-bottom: 4px; }
  .org-node .name { font-size: 13px; font-weight: bold; }

  .v-line { width: 2px; height: 24px; background: #5c8ae6; margin: 0 auto; }
  
  .branch-wrapper { display: flex; justify-content: space-around; width: 100%; position: relative; }
  .branch-wrapper::before {
    content: ''; position: absolute; top: 0; left: 25%; right: 25%; height: 2px; background: #5c8ae6;
  }
  .branch-4::before { left: 12.5%; right: 12.5%; }
  
  .branch-col { display: flex; flex-direction: column; align-items: center; flex: 1; }
  
  .top-level-container { display: flex; align-items: center; justify-content: center; position: relative; }
  .h-line-penasihat { width: 40px; height: 2px; background: #5c8ae6; }

  /* ================= STYLES ANNOUNCEMENT ACCORDION ================= */
  .announcement-card {
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  .announcement-card:hover {
    background: var(--card2);
  }
  .announcement-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .announcement-body {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.5;
  }
  .chevron {
    font-size: 12px;
    color: var(--muted);
    transition: transform 0.2s ease;
  }
  .announcement-card.active .chevron {
    transform: rotate(180deg);
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🏡 Kavling Mekarsari</h1>
    <p>RT 005 / RW 003</p>
    <label>No. Kavling / Rumah</label>
    <input id="loginKavling" placeholder="Contoh: A12" autocomplete="off">
    <label>PIN</label>
    <input id="loginPin" type="password" placeholder="6 digit PIN" inputmode="numeric">
    <div class="err" id="loginErr"></div>
    <button class="btn green" style="width:100%" onclick="doLogin()">Masuk</button>
    <p class="small" style="margin-top:16px;">Belum punya akun? Hubungi pengurus RT untuk didaftarkan.</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <header class="topbar">
    <div>
      <h1 id="headerTitle">Warga</h1>
      <div class="sub" id="headerSub"></div>
    </div>
    <button class="btn ghost" onclick="doLogout()">Keluar</button>
  </header>

  <div class="container">
    <div id="tab-warga"></div>
    <div id="tab-pengurus" class="hidden"></div>
    <div id="tab-pengumuman" class="hidden"></div>
    <div id="tab-iuran" class="hidden"></div>
    <div id="tab-keuangan" class="hidden"></div>
  </div>

  <button class="fab hidden" id="fabBtn" onclick="onFabClick()">+</button>

  <nav class="bottomnav">
    <button class="active" onclick="switchTab('warga')"><span class="ic">🏠</span>Warga</button>
    <button onclick="switchTab('pengurus')"><span class="ic">👔</span>Pengurus</button>
    <button onclick="switchTab('pengumuman')"><span class="ic">📢</span>Info</button>
    <button onclick="switchTab('iuran')"><span class="ic">💳</span>Iuran</button>
    <button onclick="switchTab('keuangan')"><span class="ic">📊</span>Keuangan</button>
  </nav>
</div>

<div id="modalRoot"></div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<!-- XLSX Library untuk Export Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="firebase-config.js"></script>
<script>
// ===================== STATE =====================
let currentUser = null;
let currentProfile = null;
let currentTab = 'warga';
let currentMonth = new Date().toISOString().slice(0,7);
let wargaCache = [];

// Default data pengurus
let baganData = {
  ketua: "Adika",
  penasihat: "H. Ayi",
  wakil: "Deni",
  sekretaris: "Angga",
  bendahara: "Hepi",
  keamanan: "Agus",
  sda: "Dahri",
  kerohanian: "Cucu",
  perempuan: "Bu Agus"
};

// ===================== HELPERS =====================
function rupiah(n){ return "Rp " + (Number(n)||0).toLocaleString('id-ID'); }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(html){ document.getElementById('modalRoot').innerHTML =
  `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function isAdmin(){ return currentProfile && currentProfile.role === 'admin'; }

// ===================== AUTH =====================
async function doLogin(){
  const kav = document.getElementById('loginKavling').value.trim().toLowerCase();
  const pin = document.getElementById('loginPin').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if(!kav || !pin){ errEl.textContent = 'Isi No. Kavling dan PIN.'; return; }
  const email = `${kav}@${AUTH_EMAIL_DOMAIN}`;
  try{
    await auth.signInWithEmailAndPassword(email, pin);
  }catch(e){
    errEl.textContent = 'No. Kavling atau PIN salah. Hubungi pengurus jika lupa PIN.';
  }
}
function doLogout(){ auth.signOut(); }

auth.onAuthStateChanged(async (user) => {
  if(user){
    currentUser = user;
    const kav = user.email.split('@')[0];
    const doc = await db.collection('warga').doc(kav).get();
    if(!doc.exists){
      alert('Profil warga tidak ditemukan. Hubungi pengurus.');
      auth.signOut();
      return;
    }
    currentProfile = { id: doc.id, ...doc.data() };
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('headerSub').textContent =
      `${currentProfile.nama} · ${isAdmin() ? 'Pengurus' : 'Warga'}`;
    switchTab('warga');
  } else {
    currentUser = null; currentProfile = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
  }
});

// ===================== TAB SWITCHING =====================
function switchTab(tab){
  currentTab = tab;
  const tabs = ['warga','pengurus','pengumuman','iuran','keuangan'];
  document.querySelectorAll('.bottomnav button').forEach((b,i) => {
    b.classList.toggle('active', tabs[i] === tab);
  });
  tabs.forEach(t =>
    document.getElementById('tab-'+t).classList.toggle('hidden', t !== tab));
  const titles = {warga:'Data Warga', pengurus:'Struktur Pengurus RT', pengumuman:'Pengumuman', iuran:'Iuran Bulanan', keuangan:'Laporan Keuangan'};
  document.getElementById('headerTitle').textContent = titles[tab];
  const fab = document.getElementById('fabBtn');
  fab.classList.toggle('hidden', !(isAdmin() && (tab==='warga'||tab==='pengumuman'||tab==='keuangan')));
  if(tab==='warga') renderWarga();
  if(tab==='pengurus') renderPengurus();
  if(tab==='pengumuman') renderPengumuman();
  if(tab==='iuran') renderIuran();
  if(tab==='keuangan') renderKeuangan();
}
function onFabClick(){
  if(currentTab==='warga') openWargaForm();
  if(currentTab==='pengumuman') openPengumumanForm();
  if(currentTab==='keuangan') openKeuanganForm();
}

// ===================== TAB: WARGA =====================
async function renderWarga(){
  const box = document.getElementById('tab-warga');
  box.innerHTML = '<div class="empty">Memuat data warga...</div>';
  const snap = await db.collection('warga').orderBy('noKavling').get();
  wargaCache = snap.docs.map(d => ({id:d.id, ...d.data()}));
  
  if(wargaCache.length===0){ box.innerHTML='<div class="empty">Belum ada data warga.</div>'; return; }
  
  let headerHtml = '';
  if(isAdmin()){
    headerHtml = `
      <div style="text-align:right; margin-bottom:12px;">
        <button class="btn green" onclick="downloadWargaExcel()">📥 Download Excel</button>
      </div>`;
  }

  const listHtml = wargaCache.map(w => `
    <div class="card">
      <div class="row">
        <div>
          <div style="font-weight:600;">${w.nama} ${w.role==='admin' ? '<span class="tag admin">Pengurus</span>':''}</div>
          <div class="small">Kavling ${w.noKavling.toUpperCase()} · KK: ${w.kk||'-'}</div>
          <div class="small">📞 ${w.notelp||'-'}</div>
        </div>
        ${isAdmin() ? `<button class="btn ghost" onclick="openWargaForm('${w.id}')">Edit</button>` : ''}
      </div>
    </div>`).join('');

  box.innerHTML = headerHtml + listHtml;
}

// FUNGSI DOWNLOAD EXCEL
function downloadWargaExcel(){
  if(!wargaCache || wargaCache.length === 0){
    alert("Tidak ada data warga untuk diunduh.");
    return;
  }

  // Format data untuk Excel
  const excelData = wargaCache.map((w, index) => ({
    "No": index + 1,
    "No Kavling": (w.noKavling || '').toUpperCase(),
    "Nama Lengkap": w.nama || '',
    "No KK": w.kk || '-',
    "No Telp / WA": w.notelp || '-',
    "Peran / Role": w.role === 'admin' ? 'Pengurus' : 'Warga'
  }));

  // Buat worksheet & workbook
  const worksheet = XLSX.utils.json_to_sheet(excelData);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Data Warga");

  // Atur lebar kolom otomatis
  worksheet['!cols'] = [
    { wch: 5 },  // No
    { wch: 15 }, // No Kavling
    { wch: 25 }, // Nama Lengkap
    { wch: 20 }, // No KK
    { wch: 18 }, // No Telp
    { wch: 15 }  // Role
  ];

  // Simpan file Excel
  XLSX.writeFile(workbook, `Data_Warga_RT_Mekarsari_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function openWargaForm(id){
  const w = id ? wargaCache.find(x=>x.id===id) : null;
  openModal(`
    <h3>${w ? 'Edit Warga' : 'Tambah Warga'}</h3>
    <label>No. Kavling</label>
    <input id="fNoKavling" value="${w? w.noKavling : ''}" ${w?'disabled':''} placeholder="Contoh: A12">
    <label>Nama Lengkap</label>
    <input id="fNama" value="${w? w.nama:''}">
    <label>No. KK</label>
    <input id="fKK" value="${w? (w.kk||''):''}">
    <label>No. Telp/WA</label>
    <input id="fTelp" value="${w? (w.notelp||''):''}">
    <label>Role</label>
    <select id="fRole">
      <option value="warga" ${w&&w.role==='warga'?'selected':''}>Warga</option>
      <option value="admin" ${w&&w.role==='admin'?'selected':''}>Pengurus (Admin)</option>
    </select>
    <div class="row">
      <button class="btn ghost" onclick="closeModal()">Batal</button>
      <button class="btn green" onclick="saveWarga('${id||''}')">Simpan</button>
    </div>
  `);
}
async function saveWarga(id){
  const noKavling = (id || document.getElementById('fNoKavling').value.trim()).toLowerCase();
  const data = {
    noKavling,
    nama: document.getElementById('fNama').value.trim(),
    kk: document.getElementById('fKK').value.trim(),
    notelp: document.getElementById('fTelp').value.trim(),
    role: document.getElementById('fRole').value,
  };
  if(!noKavling || !data.nama){ alert('No. Kavling dan Nama wajib diisi.'); return; }
  await db.collection('warga').doc(noKavling).set(data, {merge:true});
  closeModal(); renderWarga();
}

// ===================== TAB: PENGURUS (BAGAN ORGANISASI) =====================
async function renderPengurus(){
  const box = document.getElementById('tab-pengurus');
  box.innerHTML = '<div class="empty">Memuat bagan organisasi...</div>';
  
  try {
    const doc = await db.collection('pengaturan').doc('bagan_pengurus').get();
    if(doc.exists) {
      baganData = { ...baganData, ...doc.data() };
    }
  } catch(e) { console.error("Error get bagan:", e); }

  box.innerHTML = `
    ${isAdmin() ? `<div style="text-align:right; margin-bottom:10px;"><button class="btn green" onclick="openEditBaganModal()">✏️ Edit Nama Pengurus</button></div>` : ''}
    
    <div class="card org-container">
      <div class="org-chart">
        
        <!-- LEVEL 1: KETUA & PENASIHAT -->
        <div class="top-level-container">
          <div style="width: 185px;"></div>
          
          <div class="org-node">
            <div class="title">Ketua</div>
            <div class="name">${baganData.ketua || '-'}</div>
          </div>
          
          <div class="h-line-penasihat"></div>
          
          <div class="org-node">
            <div class="title">Penasihat</div>
            <div class="name">${baganData.penasihat || '-'}</div>
          </div>
        </div>

        <div class="v-line"></div>

        <!-- LEVEL 2: WAKIL KETUA -->
        <div class="org-node">
          <div class="title">Wakil Ketua</div>
          <div class="name">${baganData.wakil || '-'}</div>
        </div>

        <div class="v-line"></div>

        <!-- LEVEL 3: SEKRETARIS & BENDAHARA -->
        <div class="branch-wrapper" style="width: 360px;">
          <div class="branch-col">
            <div class="v-line"></div>
            <div class="org-node">
              <div class="title">Sekretaris</div>
              <div class="name">${baganData.sekretaris || '-'}</div>
            </div>
          </div>
          <div class="branch-col">
            <div class="v-line"></div>
            <div class="org-node">
              <div class="title">Bendahara</div>
              <div class="name">${baganData.bendahara || '-'}</div>
            </div>
          </div>
        </div>

        <div class="v-line"></div>

        <!-- LEVEL 4: SEKSI-SEKSI -->
        <div class="branch-wrapper branch-4" style="width: 660px;">
          <div class="branch-col">
            <div class="v-line"></div>
            <div class="org-node">
              <div class="title">Sie. Keamanan & Ketertiban</div>
              <div class="name">${baganData.keamanan || '-'}</div>
            </div>
          </div>
          <div class="branch-col">
            <div class="v-line"></div>
            <div class="org-node">
              <div class="title">Sie. Pengembangan & SDA</div>
              <div class="name">${baganData.sda || '-'}</div>
            </div>
          </div>
          <div class="branch-col">
            <div class="v-line"></div>
            <div class="org-node">
              <div class="title">Sie. Kerohanian</div>
              <div class="name">${baganData.kerohanian || '-'}</div>
            </div>
          </div>
          <div class="branch-col">
            <div class="v-line"></div>
            <div class="org-node">
              <div class="title">Koord. Perempuan</div>
              <div class="name">${baganData.perempuan || '-'}</div>
            </div>
          </div>
        </div>

      </div>
    </div>
    <div class="small" style="text-align:center; margin-top:6px;">Geser ke kanan jika bagan terpotong di HP ➔</div>
  `;
}

function openEditBaganModal(){
  openModal(`
    <h3>Edit Nama Pengurus</h3>
    <label>Ketua</label>
    <input id="bKetua" value="${baganData.ketua||''}">
    <label>Penasihat</label>
    <input id="bPenasihat" value="${baganData.penasihat||''}">
    <label>Wakil Ketua</label>
    <input id="bWakil" value="${baganData.wakil||''}">
    <label>Sekretaris</label>
    <input id="bSekretaris" value="${baganData.sekretaris||''}">
    <label>Bendahara</label>
    <input id="bBendahara" value="${baganData.bendahara||''}">
    <label>Sie. Keamanan dan Ketertiban</label>
    <input id="bKeamanan" value="${baganData.keamanan||''}">
    <label>Sie. Pengembangan & SDA</label>
    <input id="bSda" value="${baganData.sda||''}">
    <label>Sie. Kerohanian</label>
    <input id="bKerohanian" value="${baganData.kerohanian||''}">
    <label>Koord. Perempuan</label>
    <input id="bPerempuan" value="${baganData.perempuan||''}">
    
    <div class="row" style="margin-top:12px;">
      <button class="btn ghost" onclick="closeModal()">Batal</button>
      <button class="btn green" id="btnSaveBagan" onclick="saveBagan()">Simpan Bagan</button>
    </div>
  `);
}

async function saveBagan(){
  const btn = document.getElementById('btnSaveBagan');
  if(btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }

  const dataInput = {
    ketua: document.getElementById('bKetua').value.trim(),
    penasihat: document.getElementById('bPenasihat').value.trim(),
    wakil: document.getElementById('bWakil').value.trim(),
    sekretaris: document.getElementById('bSekretaris').value.trim(),
    bendahara: document.getElementById('bBendahara').value.trim(),
    keamanan: document.getElementById('bKeamanan').value.trim(),
    sda: document.getElementById('bSda').value.trim(),
    kerohanian: document.getElementById('bKerohanian').value.trim(),
    perempuan: document.getElementById('bPerempuan').value.trim()
  };

  try {
    await db.collection('pengaturan').doc('bagan_pengurus').set(dataInput, { merge: true });
    baganData = { ...baganData, ...dataInput };
    closeModal();
    renderPengurus();
  } catch(e) {
    alert('Gagal menyimpan data pengurus: ' + e.message);
    if(btn) { btn.disabled = false; btn.textContent = 'Simpan Bagan'; }
  }
}

// ===================== TAB: PENGUMUMAN =====================
async function renderPengumuman(){
  const box = document.getElementById('tab-pengumuman');
  box.innerHTML = '<div class="empty">Memuat pengumuman...</div>';
  const snap = await db.collection('pengumuman').orderBy('tanggal','desc').limit(50).get();
  if(snap.empty){ box.innerHTML='<div class="empty">Belum ada pengumuman.</div>'; return; }
  
  box.innerHTML = snap.docs.map(d => {
    const p = d.data();
    const tgl = p.tanggal && p.tanggal.toDate ? p.tanggal.toDate().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}) : '';
    return `
    <div class="card announcement-card" onclick="toggleAnnouncement(this)">
      <div class="announcement-header">
        <div>
          <div style="font-weight:600; font-size:15px; color:var(--text);">${p.judul}</div>
          <div class="small" style="margin-top:2px;">${tgl} · oleh ${p.olehNama||'Pengurus'}</div>
        </div>
        <div class="chevron">▼</div>
      </div>
      <div class="announcement-body hidden">${p.isi}</div>
    </div>`;
  }).join('');
}

function toggleAnnouncement(cardEl){
  const bodyEl = cardEl.querySelector('.announcement-body');
  cardEl.classList.toggle('active');
  bodyEl.classList.toggle('hidden');
}

function openPengumumanForm(){
  openModal(`
    <h3>Buat Pengumuman</h3>
    <label>Judul</label>
    <input id="fJudul" placeholder="Contoh: Kerja Bakti Minggu Ini">
    <label>Isi Pengumuman</label>
    <textarea id="fIsi" rows="5" placeholder="Tulis detail pengumuman..."></textarea>
    <div class="row">
      <button class="btn ghost" onclick="closeModal()">Batal</button>
      <button class="btn green" onclick="savePengumuman()">Kirim</button>
    </div>
  `);
}
async function savePengumuman(){
  const judul = document.getElementById('fJudul').value.trim();
  const isi = document.getElementById('fIsi').value.trim();
  if(!judul || !isi){ alert('Judul dan isi wajib diisi.'); return; }
  await db.collection('pengumuman').add({
    judul, isi,
    tanggal: firebase.firestore.FieldValue.serverTimestamp(),
    olehNoKavling: currentProfile.noKavling,
    olehNama: currentProfile.nama
  });
  closeModal(); renderPengumuman();
}

// ===================== TAB: IURAN =====================
function shiftMonth(delta){
  const [y,m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  currentMonth = d.toISOString().slice(0,7);
  renderIuran();
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
}
async function renderIuran(){
  const box = document.getElementById('tab-iuran');
  box.innerHTML = `
    <div class="month-nav">
      <button class="btn ghost" onclick="shiftMonth(-1)">‹</button>
      <div class="m">${monthLabel(currentMonth)}</div>
      <button class="btn ghost" onclick="shiftMonth(1)">›</button>
    </div>
    <div id="iuranList" class="empty">Memuat data iuran...</div>`;

  if(wargaCache.length===0){
    const snap = await db.collection('warga').orderBy('noKavling').get();
    wargaCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
  }
  const iuranSnap = await db.collection('iuran').where('bulan','==',currentMonth).get();
  const iuranMap = {};
  iuranSnap.docs.forEach(d => iuranMap[d.data().noKavling] = {id:d.id, ...d.data()});

  const list = document.getElementById('iuranList');
  const rows = wargaCache.map(w => {
    const rec = iuranMap[w.noKavling];
    const status = rec ? rec.status : 'belum';
    const isMine = currentProfile.noKavling === w.noKavling;
    let actionHtml = '';
    if(isAdmin() && status === 'menunggu'){
      actionHtml = `<button class="btn green" style="margin-right:6px;" onclick="verifikasiIuran('${rec.id}','lunas')">Verifikasi</button>
                    <button class="btn red" onclick="verifikasiIuran('${rec.id}','belum')">Tolak</button>`;
    } else if(isMine && status !== 'lunas' && status !== 'menunggu'){
      actionHtml = `<button class="btn ghost" onclick="openUploadBukti('${w.noKavling}')">Bayar / Upload Bukti</button>`;
    } else if(isMine && status === 'menunggu'){
      actionHtml = `<span class="small">Menunggu verifikasi pengurus</span>`;
    }
    return `<div class="card">
      <div class="row">
        <div>
          <div style="font-weight:600;">${w.nama}</div>
          <div class="small">Kavling ${w.noKavling.toUpperCase()}${rec&&rec.nominal ? ' · '+rupiah(rec.nominal):''}</div>
        </div>
        <span class="tag ${status}">${status==='lunas'?'Lunas':status==='menunggu'?'Menunggu':'Belum Bayar'}</span>
      </div>
      ${rec && rec.buktiUrl ? `<img class="bukti-preview" src="${rec.buktiUrl}">` : ''}
      ${actionHtml ? `<div style="margin-top:10px;">${actionHtml}</div>` : ''}
    </div>`;
  }).join('');
  list.outerHTML = `<div id="iuranList">${rows || '<div class="empty">Belum ada data warga.</div>'}</div>`;
}

function openUploadBukti(noKavling){
  openModal(`
    <h3>Bayar & Upload Bukti</h3>
    <div style="background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px; text-align:center;">
      <div class="small" style="margin-bottom:8px;">Scan QRIS di bawah via GoPay, DANA, OVO, ShopeePay, atau Mobile Banking:</div>
      <img src="https://via.placeholder.com/200x200.png?text=QRIS+RT" style="width:180px; height:180px; border-radius:8px; border:1px solid var(--border); background:#fff;">
      <div class="divider" style="margin:10px 0;"></div>
      <div class="small" style="margin-bottom:4px;">Atau Transfer Langsung:</div>
      <div style="font-weight:600; font-size:13px; color:var(--text);">DANA / GoPay: 0812-3456-7890</div>
      <div style="font-weight:600; font-size:13px; color:var(--text);">BCA: 1234567890 (a.n. Bendahara RT)</div>
    </div>
    <label>Nominal Iuran (Rp)</label>
    <input id="fNominal" type="number" placeholder="Contoh: 50000">
    <label>Foto Bukti Transfer</label>
    <input id="fBukti" type="file" accept="image/*">
    <div class="row" style="margin-top:8px;">
      <button class="btn ghost" onclick="closeModal()">Batal</button>
      <button class="btn green" onclick="submitBukti('${noKavling}')">Kirim Bukti</button>
    </div>
  `);
}

async function submitBukti(noKavling){
  const nominal = Number(document.getElementById('fNominal').value);
  const file = document.getElementById('fBukti').files[0];
  if(!nominal || !file){ alert('Isi nominal dan pilih foto bukti transfer.'); return; }
  const path = `buktiTransfer/${noKavling}/${currentMonth}-${Date.now()}.jpg`;
  const ref = storage.ref().child(path);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await db.collection('iuran').add({
    noKavling, bulan: currentMonth, nominal, status:'menunggu',
    buktiUrl: url, tanggalUpload: firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal(); renderIuran();
}
async function verifikasiIuran(iuranId, status){
  await db.collection('iuran').doc(iuranId).update({
    status,
    tanggalVerifikasi: firebase.firestore.FieldValue.serverTimestamp(),
    verifikatorNoKavling: currentProfile.noKavling
  });
  renderIuran();
}

// ===================== TAB: KEUANGAN =====================
async function renderKeuangan(){
  const box = document.getElementById('tab-keuangan');
  box.innerHTML = '<div class="empty">Menghitung laporan keuangan...</div>';

  const [iuranLunasSnap, manualSnap] = await Promise.all([
    db.collection('iuran').where('status','==','lunas').get(),
    db.collection('keuangan_manual').orderBy('tanggal','desc').get()
  ]);

  let totalIuran = 0;
  iuranLunasSnap.docs.forEach(d => totalIuran += Number(d.data().nominal)||0);

  let totalManualMasuk = 0, totalKeluar = 0;
  const manualList = manualSnap.docs.map(d => {
    const m = d.data();
    if(m.jenis === 'masuk') totalManualMasuk += Number(m.jumlah)||0;
    else totalKeluar += Number(m.jumlah)||0;
    return {id:d.id, ...m};
  });

  const totalMasuk = totalIuran + totalManualMasuk;
  const saldo = totalMasuk - totalKeluar;

  const listHtml = manualList.map(m => {
    const tgl = m.tanggal && m.tanggal.toDate ? m.tanggal.toDate().toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) : '';
    return `<div class="card">
      <div class="row">
        <div>
          <div style="font-weight:600;">${m.keterangan}</div>
          <div class="small">${tgl}</div>
        </div>
        <div style="font-weight:700;color:${m.jenis==='masuk'?'var(--accent)':'var(--danger)'}">
          ${m.jenis==='masuk'?'+':'-'} ${rupiah(m.jumlah)}
        </div>
      </div>
    </div>`;
  }).join('');

  box.innerHTML = `
    <div class="summary-grid">
      <div class="card"><div class="num" style="color:var(--accent)">${rupiah(totalMasuk)}</div><div class="lbl">Total Masuk</div></div>
      <div class="card"><div class="num" style="color:var(--danger)">${rupiah(totalKeluar)}</div><div class="lbl">Total Keluar</div></div>
      <div class="card"><div class="num">${rupiah(saldo)}</div><div class="lbl">Saldo Kas</div></div>
    </div>
    <div class="small" style="margin-bottom:10px;">💡 Total Masuk = Iuran warga (terverifikasi lunas) + pemasukan lain-lain.</div>
    <h4 style="margin-bottom:8px;">Riwayat Transaksi Manual</h4>
    ${listHtml || '<div class="empty">Belum ada transaksi manual.</div>'}
  `;
}
function openKeuanganForm(){
  openModal(`
    <h3>Catat Transaksi</h3>
    <label>Jenis</label>
    <select id="fJenis">
      <option value="keluar">Pengeluaran</option>
      <option value="masuk">Pemasukan Lain</option>
    </select>
    <label>Jumlah (Rp)</label>
    <input id="fJumlah" type="number" placeholder="Contoh: 150000">
    <label>Keterangan</label>
    <input id="fKeterangan" placeholder="Contoh: Beli lampu jalan">
    <div class="row">
      <button class="btn ghost" onclick="closeModal()">Batal</button>
      <button class="btn green" onclick="saveKeuangan()">Simpan</button>
    </div>
  `);
}
async function saveKeuangan(){
  const jenis = document.getElementById('fJenis').value;
  const jumlah = Number(document.getElementById('fJumlah').value);
  const keterangan = document.getElementById('fKeterangan').value.trim();
  if(!jumlah || !keterangan){ alert('Jumlah dan keterangan wajib diisi.'); return; }
  await db.collection('keuangan_manual').add({
    jenis, jumlah, keterangan,
    tanggal: firebase.firestore.FieldValue.serverTimestamp(),
    olehNoKavling: currentProfile.noKavling
  });
  closeModal(); renderKeuangan();
}
